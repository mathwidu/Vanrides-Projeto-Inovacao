worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/null;
events { worker_connections 128; }
http {
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  client_max_body_size 32k;
  client_body_buffer_size 32k;
  client_header_timeout 8s;
  client_body_timeout 8s;
  send_timeout 8s;
  keepalive_timeout 5s;
  # Traefik terminates TLS. Do not trust a client-supplied X-Forwarded-For.
  # These limits may therefore aggregate requests from the same proxy hop.
  limit_conn_zone $binary_remote_addr zone=clients:1m;
  limit_conn_zone $server_name zone=total:1m;
  limit_req_zone $binary_remote_addr zone=requests:1m rate=5r/s;
  map $http_host $gps_host_allowed {
    default 0;
    gps-spike.vanrides.matheusduarte.dev.br 1;
    gps-spike.vanrides.matheusduarte.dev.br:443 1;
  }
  upstream collector { server receiver:18765; keepalive 4; }
  server {
    listen 8080;
    server_name gps-spike.vanrides.matheusduarte.dev.br;
    limit_conn clients 8;
    limit_conn total 20;
    limit_req zone=requests burst=10 nodelay;
    limit_conn_status 429;
    limit_req_status 429;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
    default_type application/json;
    if ($gps_host_allowed = 0) { return 400; }
    # Also sanitize nginx/Gunicorn parser and unavailable-upstream responses.
    # Receiver 401/403/404/409/410 retain their specific JSON code.
    error_page 400 405 411 414 431 = @invalid_request;
    error_page 408 = @request_timeout;
    error_page 413 = @body_too_large;
    error_page 429 = @rate_limited;
    error_page 500 502 503 504 = @unavailable;
    location @invalid_request { return 400 '{"code":"INVALID_REQUEST"}'; }
    location @request_timeout { return 503 '{"code":"REQUEST_TIMEOUT"}'; }
    location @body_too_large { return 413 '{"code":"BODY_TOO_LARGE"}'; }
    location @rate_limited { return 429 '{"code":"RATE_LIMITED"}'; }
    location @unavailable { return 503 '{"code":"UNAVAILABLE"}'; }
    location = /driver-app/v1 { return 404 '{"code":"NOT_FOUND"}'; }
    location /driver-app/v1/ {
      if ($request_method !~ ^(GET|POST)$) { return 400; }
      proxy_request_buffering on;
      proxy_buffering on;
      proxy_max_temp_file_size 0;
      proxy_intercept_errors on;
      proxy_next_upstream off;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host gps-spike.vanrides.matheusduarte.dev.br;
      proxy_hide_header Cache-Control;
      proxy_hide_header X-Content-Type-Options;
      proxy_connect_timeout 3s;
      proxy_send_timeout 8s;
      proxy_read_timeout 10s;
      proxy_pass http://collector;
    }
    location / {
      return 404 '{"code":"NOT_FOUND"}';
    }
  }
}
