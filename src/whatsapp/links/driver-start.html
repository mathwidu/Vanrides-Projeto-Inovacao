<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; connect-src 'none'">
  <title>Abrir a saída no VanRides Motorista</title>
  <style>
    :root { color-scheme: light; font: 110%/1.55 system-ui,sans-serif; color:#15332a; background:#f2f6f3 }
    main { margin:10vh auto; padding:1.5rem; max-width:28rem }
    h1 { line-height:1.15 }
    button { font:inherit; font-weight:650; border:0; border-radius:.5rem; padding:.75rem 1.1rem; color:white; background:#176b52 }
    button:focus-visible { outline:.2rem solid #111; outline-offset:.2rem }
  </style>
</head>
<body>
  <main>
    <p>VanRides Motorista</p>
    <h1>Preparar sua saída</h1>
    <p id="instruction">Volte à conversa do VanRides no WhatsApp e peça um novo link de início ou retomada.</p>
    <button id="open-driver" type="button" hidden>Abrir VanRides Motorista</button>
    <noscript>Para abrir o aplicativo por este link, permita JavaScript no navegador.</noscript>
  </main>
  <script src="/motorista/saida.js" defer></script>
</body>
</html>
