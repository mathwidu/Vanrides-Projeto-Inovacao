        "summary": "Persistir evento autenticado Evolution2.3.7",
        "description": "Normalização determinística; ACK202 somente após commit. Dedup por mensagem e, separadamente, status/conexão. Flag desligada ignora novas mensagens, mantendo recibos de canal. Nunca aceitar ator do modelo ou usar sender do envelope como passageiro.120 projeta somente CONNECTION autenticado por ambiente/instância; evento antigo não reabre e empate prefere suspensão. occurredAt até30s futuro usa agora da API para ordenar; acima disso retorna400 INVALID_PAYLOAD sem gravar recibo/projeção. OPEN exige CHANNEL fonte válido e não comprova conexão no instante do envio.",
