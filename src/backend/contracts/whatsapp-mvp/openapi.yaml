  "components": {
    "securitySchemes": {
      "ServiceBearer": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "opaque-service-credential",
        "description": "Credencial exclusiva de CHANNEL/CONVERSATION_WORKER/DELIVERY_WORKER/SYSTEM_JOB por ambiente; guard de método/rota/principal. Não é usuário/OPERATOR."
      },
      "DeviceSession": {
        "type": "apiKey",
        "in": "header",
        "name": "Authorization",
        "description": "Authorization: DPoP <access token opaco>. Vinculado à chave; requer DPoPProof com ath. Nunca Basic/Bearer/JWT legado."
      },
      "DPoPProof": {
        "type": "apiKey",
        "in": "header",
        "name": "DPoP",
        "description": "Prova JWS ES256 typ=dpop+jwt,nonce,JTI,iat,htm,htu canônica; ath quando access e vr_body_sha256 nas operações documentadas."
      }
    },
    "parameters": {
      "IdempotencyKey": {
        "name": "Idempotency-Key",
        "in": "header",
        "required": true,
        "description": "Chave opaca do cliente (8..128), escopo principal+operação+hash do corpo. Commands: resultado sem segredos24h; begin: até expiração do pedido5min; redeem/refresh/revoke: replay criptografado5min, prova nova e estado autorizado atual. Não reemitir resultado expirado nem credenciais supersedidas/revogadas. Mesmo corpo/chave recupera resultado elegível; corpo distinto409. Comandos também têm unicidade durável por inboxEventId: trocar a chave não repete o evento.",
        "schema": {
          "type": "string",
          "minLength": 8,
          "maxLength": 128,
          "pattern": "^[A-Za-z0-9._:-]+$"
        }
      },
      "InboxLease": {
        "name": "X-Inbox-Lease",
        "in": "header",
        "required": true,
        "description": "Token opaco da tentativa corrente; validado transacionalmente com evento,conversa,principal,geração e expiração antes de leitura/efeito/ACK.",
        "schema": {
          "$ref": "#/components/schemas/OpaqueCredential"
        }
      },
      "DPoP": {
        "name": "DPoP",
        "in": "header",
        "required": true,
        "description": "JWS ES256 typ=dpop+jwt, chaveP-256 vinculada, nonce do servidor,JTI único,iat,htm,htu canônica. POSTbegin/redeem/refresh/revoke exige vr_body_sha256 dos bytes exatos do corpo; com access token exige ath. Nunca aceitar prova apenas decodificada ou chave substituída. Não há exemplo assinado reutilizável.",
        "schema": {
          "type": "string",
          "minLength": 16,
          "maxLength": 6000
        }
      },
