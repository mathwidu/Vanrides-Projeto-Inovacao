spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vanrides_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:vanrides_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:true}
