spring.application.name=vanrides

# Isolated WhatsApp context. Disabled does not remove its ingress guard.
vanrides.wa.enabled=${WA_MVP_ENABLED:false}
vanrides.wa.team-api-only=${WA_TEAM_API_ONLY:false}
vanrides.wa.new-starts-enabled=${WA_NEW_STARTS_ENABLED:true}
vanrides.wa.approach-enabled=${WA_APPROACH_ENABLED:false}
vanrides.wa.approach-reviewed-routine-ids=${WA_APPROACH_REVIEWED_ROUTINE_IDS:}
vanrides.wa.test-cohort-only=${WA_TEST_COHORT_ONLY:true}
vanrides.wa.environment=${WA_ENVIRONMENT:disabled}
vanrides.wa.public-base-url=${WA_PUBLIC_BASE_URL:}
vanrides.wa.hash-key=${WA_SECRET_HASH_KEY:}
vanrides.wa.response-key=${WA_RESPONSE_ENCRYPTION_KEY:}
vanrides.wa.operator-credential=${WA_OPERATOR_CREDENTIAL:}
vanrides.wa.operator-expires-at=${WA_OPERATOR_EXPIRES_AT:}

# Carrega um arquivo `.env` (formato .properties) quando existir, útil para dev local
spring.config.import=optional:file:.env[.properties]

# Perfil default (pode ser sobrescrito por env var SPRING_PROFILES_ACTIVE)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Porta HTTP (pode ser sobrescrita por env var SERVER_PORT)
server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=none
server.tomcat.threads.max=${VANRIDES_HTTP_MAX_THREADS:200}
server.http2.enabled=false
# Nunca drene corpo não lido no worker após uma resposta; o valve fecha a conexão.
server.tomcat.max-swallow-size=0

# Banco versionado via Flyway.
# Em bancos já existentes, o baseline permite começar a gerenciar o schema
# sem recriar tabelas em ambientes já provisionados.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Google (usado no GeocodingService)
google.api.key=${GOOGLE_API_KEY:}
vanrides.routing.provider=${VANRIDES_ROUTING_PROVIDER:static}

# Data operacional compartilhada por viagens, autorizacao e realtime.
vanrides.operations.time-zone=${VANRIDES_OPERATIONS_TIME_ZONE:America/Sao_Paulo}

# VanRides Maps Platform (interno, desligado por padrao)
vanrides.maps-platform.enabled=${VANRIDES_MAPS_PLATFORM_ENABLED:false}
vanrides.maps-platform.base-url=${VANRIDES_MAPS_PLATFORM_BASE_URL:http://127.0.0.1:18080}

# Push externo fica desativado ate existir um adapter explicitamente selecionado.
vanrides.push.provider=${VANRIDES_PUSH_PROVIDER:none}

# CORS (configurado no CorsConfig)
vanrides.cors.allowed-origin-patterns=${VANRIDES_CORS_ALLOWED_ORIGIN_PATTERNS:*}
vanrides.cors.allowed-methods=${VANRIDES_CORS_ALLOWED_METHODS:*}
vanrides.cors.allowed-headers=${VANRIDES_CORS_ALLOWED_HEADERS:*}

# Auth v2 (incremental, com compatibilidade para Basic)
vanrides.auth.basic-enabled=${VANRIDES_AUTH_BASIC_ENABLED:true}
vanrides.auth.jwt-secret=${VANRIDES_JWT_SECRET:}
vanrides.auth.access-token-ttl-minutes=${VANRIDES_ACCESS_TOKEN_TTL_MINUTES:15}
vanrides.auth.refresh-token-ttl-days=${VANRIDES_REFRESH_TOKEN_TTL_DAYS:30}

# Observabilidade / hardening operacional
logging.pattern.level=%5p [requestId:%X{requestId:-none}]
vanrides.rate-limit.enabled=${VANRIDES_RATE_LIMIT_ENABLED:true}
vanrides.rate-limit.sensitive-limit=${VANRIDES_RATE_LIMIT_SENSITIVE_LIMIT:30}
vanrides.rate-limit.window-seconds=${VANRIDES_RATE_LIMIT_WINDOW_SECONDS:60}
vanrides.rate-limit.max-entries-per-route=${VANRIDES_RATE_LIMIT_MAX_ENTRIES_PER_ROUTE:10000}
vanrides.rate-limit.trusted-proxy-cidrs=${VANRIDES_RATE_LIMIT_TRUSTED_PROXY_CIDRS:}
vanrides.rate-limit.forwarded-max-bytes=${VANRIDES_RATE_LIMIT_FORWARDED_MAX_BYTES:1024}
vanrides.rate-limit.forwarded-max-hops=${VANRIDES_RATE_LIMIT_FORWARDED_MAX_HOPS:10}
vanrides.request-body.max-bytes=${VANRIDES_REQUEST_BODY_MAX_BYTES:1048576}
vanrides.request-body.max-concurrent-reads=${VANRIDES_REQUEST_BODY_MAX_CONCURRENT_READS:32}
vanrides.request-body.reserved-request-threads=${VANRIDES_REQUEST_BODY_RESERVED_REQUEST_THREADS:16}

# Upload multipart possui limite próprio e não depende do parser JSON.
spring.servlet.multipart.max-file-size=512KB
spring.servlet.multipart.max-request-size=${VANRIDES_REQUEST_BODY_MAX_BYTES:1048576}B
server.tomcat.max-http-form-post-size=${VANRIDES_REQUEST_BODY_MAX_BYTES:1048576}B

# Actuator coleta métricas internamente; por padrão somente health/info ficam
# expostos. Stacks publicados usam uma porta management vinculada ao loopback.
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info}
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}

# Email transacional / verificacao de e-mail
vanrides.email.provider=${VANRIDES_EMAIL_PROVIDER:log}
vanrides.email.from=${VANRIDES_EMAIL_FROM:VanRides <noreply@notifications.matheusduarte.dev.br>}
vanrides.email.resend.api-key=${VANRIDES_EMAIL_RESEND_API_KEY:}
vanrides.email.verification.token-ttl-minutes=${VANRIDES_EMAIL_VERIFICATION_TOKEN_TTL_MINUTES:1440}
vanrides.email.verification.resend-cooldown-minutes=${VANRIDES_EMAIL_VERIFICATION_RESEND_COOLDOWN_MINUTES:15}
vanrides.email.verification.public-base-url=${VANRIDES_EMAIL_VERIFICATION_PUBLIC_BASE_URL:http://localhost:${server.port}/auth/email-verifications/confirm}

# QA/DEV only: dominios que podem nascer verificados por provisionamento administrativo.
# Default vazio preserva o fluxo publico normal de verificacao de e-mail.
vanrides.qa.auto-verify-email-domains=${VANRIDES_QA_AUTO_VERIFY_EMAIL_DOMAINS:${VANRIDES_QA_AUTO_VERIFY_BOOTSTRAP_DOMAINS:}}
