name: Backend
'on':
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
permissions:
  contents: read
concurrency:
  group: backend-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    name: Construir API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      jar-sha256: ${{ steps.image.outputs.jar-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: src/backend/pom.xml
      - name: Empacotar sem executar ou compilar testes
        working-directory: src/backend
        run: ./mvnw -B -ntp -Dmaven.test.skip=true package
      - name: Montar a imagem e publicar na main
        id: image
        env:
          JAVA_IMAGE: ${{ vars.VANRIDES_HML_JAVA_IMAGE }}
          GHCR_TOKEN: ${{ github.repository == 'mathwidu/Vanrides-Projeto-Inovacao' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.token || '' }}
        run: |
          set -euo pipefail
          [[ "$JAVA_IMAGE" =~ ^eclipse-temurin@sha256:[a-f0-9]{64}$ ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          shopt -s nullglob
          jars=(src/backend/target/*.jar)
          [[ "${#jars[@]}" == 1 && -f "${jars[0]}" && ! -L "${jars[0]}" ]]
          read -r jar_sha _ < <(sha256sum "${jars[0]}")
          context=$(mktemp -d "$RUNNER_TEMP/vanrides-image.XXXXXX")
          mkdir "$context/build"
          cp deploy/homologacao/{Dockerfile,entrypoint.sh} "$context/build/"
          cp "${jars[0]}" "$context/build/backend.jar"

          output=(--load)
          if [[ "$GITHUB_REPOSITORY" == mathwidu/Vanrides-Projeto-Inovacao && "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            [[ -n "$GHCR_TOKEN" ]]
            export DOCKER_CONFIG="$context/docker-config"
            mkdir -m 700 "$DOCKER_CONFIG"
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
            unset GHCR_TOKEN
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            output=(--push --metadata-file "$context/metadata.json")
          fi
          docker buildx build --platform linux/amd64 "${output[@]}" \
            --tag "ghcr.io/mathwidu/vanrides-projeto-inovacao-team-api:sha-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --build-arg "JAVA_IMAGE=$JAVA_IMAGE" --build-arg "SOURCE_SHA=$GITHUB_SHA" \
            --build-arg "SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')" --build-arg "JAR_SHA256=$jar_sha" \
            "$context/build"
          if [[ "${output[0]}" == --push ]]; then
            digest=$(jq -er '."containerimage.digest"' "$context/metadata.json")
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            printf 'digest=%s\njar-sha256=%s\n' "$digest" "$jar_sha" >> "$GITHUB_OUTPUT"
            printf 'Imagem GHCR: %s\n\nRevisão: %s\n\nChecksum do JAR: %s\n' \
              "$digest" "$GITHUB_SHA" "$jar_sha" >> "$GITHUB_STEP_SUMMARY"
          fi
  deploy_homologacao:
    name: Atualizar API da homologação da equipe
    needs: build
    if: github.repository == 'mathwidu/Vanrides-Projeto-Inovacao' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    environment: homologacao
    steps:
      - name: Solicitar rollout ao comando SSH dedicado
        env:
          SSH_TARGET: ${{ vars.VANRIDES_HML_SSH_TARGET }}
          SSH_KEY: ${{ secrets.VANRIDES_HML_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.VANRIDES_HML_SSH_KNOWN_HOSTS }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          JAR_SHA256: ${{ needs.build.outputs.jar-sha256 }}
        run: |
          set -euo pipefail
          [[ "$SSH_TARGET" =~ ^mathwidu@[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          [[ -n "$SSH_KEY" && -n "$SSH_KNOWN_HOSTS" ]]
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ && "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ && "$JAR_SHA256" =~ ^[a-f0-9]{64}$ ]]
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/vanrides-ssh.XXXXXX")
          umask 077
          printf '%s\n' "$SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          unset SSH_KEY
          trap 'unlink "$ssh_dir/key"; unlink "$ssh_dir/known_hosts"; rmdir "$ssh_dir"' EXIT
          ssh -nT -F /dev/null -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$ssh_dir/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            -o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            "$SSH_TARGET" "deploy $GITHUB_SHA $IMAGE_DIGEST $JAR_SHA256"
