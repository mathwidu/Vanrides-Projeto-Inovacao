name: Backend e integração sintética
'on':
  pull_request:
    paths: ['src/backend/**', 'src/whatsapp/**', 'scripts/check_backend.sh', '.github/workflows/backend.yml']
  push:
    branches: [main]
    paths: ['src/backend/**', 'src/whatsapp/**', 'scripts/check_backend.sh', '.github/workflows/backend.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quick:
    name: Verificações rápidas do backend
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Regras estáticas e testes dos auxiliares, sem Maven ou Docker
        run: bash scripts/check_backend.sh --light
  test:
    name: Suíte canônica PostgreSQL
    needs: quick
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VANRIDES_QA_REQUIRE_CLEAN: "1"
      VANRIDES_QA_RETENTION_CLASS: ci
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout da revisão avaliada
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Parte PostgreSQL do gate, após as verificações rápidas obrigatórias
        working-directory: src/backend
        run: ./scripts/qa_integration_profile.sh --all-tests
  integration:
    name: Integração HTTP e imagem
    needs: quick
    runs-on: ubuntu-latest
    # Seis jornadas levaram 24 min no Mac. O job inclui também setup, empacotamento e imagem.
    timeout-minutes: 35
    env:
      VANRIDES_EXPECTED_SOURCE_SHA: ${{ github.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout da mesma revisão avaliada pela suíte
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Node 22 do worker
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - name: Empacotar e executar seis jornadas HTTP no mesmo checkout
        run: bash scripts/check_backend.sh --integration-only
      - name: Construir imagem local sem publicação
        run: docker build -t vanrides-backend:ci src/backend
      - name: Identificar a fonte e os limites
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          printf 'Integração HTTP e imagem avaliadas em %s. PostgreSQL isolado e provedor sintético em loopback; sem WhatsApp, IA ao vivo ou dispositivos. Suíte canônica em job independente igualmente obrigatório. Nenhuma implantação.\n' "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
  result:
    name: Resultado do backend
    needs: [quick, test, integration]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Resumo das etapas e resultado conjunto
        env:
          SOURCE_SHA: ${{ github.sha }}
          QUICK: ${{ needs.quick.result }}
          TESTS: ${{ needs.test.result }}
          INTEGRATION: ${{ needs.integration.result }}
        run: |
          {
            printf '### Backend\n\nRevisão: %s\n\n' "$SOURCE_SHA"
            printf '| Etapa | Resultado |\n|---|---|\n'
            printf '| Verificações rápidas | %s |\n' "$QUICK"
            printf '| PostgreSQL | %s |\n' "$TESTS"
            printf '| Jornadas HTTP e imagem | %s |\n' "$INTEGRATION"
            printf '\nDetalhes no job que falhou. Sem serviços reais ou implantação.\n'
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$QUICK" == success && "$TESTS" == success && "$INTEGRATION" == success ]]
