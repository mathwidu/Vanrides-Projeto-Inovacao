pid /tmp/nginx.pid;
worker_processes 1;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 8080;
        root /srv/vanrides;
        add_header Referrer-Policy no-referrer always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control no-store always;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        location = /.well-known/assetlinks.json { default_type application/json; alias /srv/vanrides/assetlinks.json; }
        location = /motorista/vinculo/retorno { default_type text/html; alias /srv/vanrides/driver-return.html; }
        location = /motorista/saida { default_type text/html; alias /srv/vanrides/driver-start.html; }
        location = /motorista/saida.js { default_type application/javascript; alias /srv/vanrides/driver-start.js; }
        location = /motorista/VanRides.apk { default_type application/vnd.android.package-archive; alias /srv/vanrides/VanRides.apk; }
        location / { return 404; }
    }
}
