<text x="165.0" y="160" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#252525">cadastro e ponto</text>
<text x="165.0" y="188" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#252525">motorista aprova</text>
