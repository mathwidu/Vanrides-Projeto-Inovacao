<text x="500.0" y="128" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold" fill="#343434">2 Rotina e presença</text>
<text x="500.0" y="160" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#252525">data e sentido</text>
<text x="500.0" y="188" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#252525">resposta do passageiro</text>
<rect x="700" y="95" width="270" height="115" rx="3" fill="#F7F7F7" stroke="#343434" stroke-width="1.6"/>
