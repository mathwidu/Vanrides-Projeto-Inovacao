<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#343434"/></marker></defs>
<rect width="1000" height="660" fill="white"/>
<text x="500" y="38" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="bold" fill="#343434">Etapas de uso</text>
<text x="500" y="72" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#252525">Sequência de uso e etapas seguintes do MVP</text>
<rect x="30" y="95" width="270" height="115" rx="3" fill="#F7F7F7" stroke="#343434" stroke-width="1.6"/>
